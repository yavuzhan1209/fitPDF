name: fitpdf
description: FitPDF - Compress and Share your PDFs with style.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  file_picker: ^8.1.2
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  path: ^1.9.0
  percent_indicator: ^4.2.3
  image: ^4.1.7
  pdfx: ^2.8.0
  syncfusion_flutter_pdf: ^32.2.9
  syncfusion_flutter_core: ^32.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/